<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Niaz Ul Haque, software engineer, Toronto, Canada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#0B0F16"/>
      <stop offset="0.5" stop-color="#16324F"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="wA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8FD0FF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="wB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <style>
      .a{animation:slide 22s linear infinite}
      .b{animation:slide 34s linear infinite}
      @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      .t{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:54px;fill:#E9F1FA;letter-spacing:0.5px}
      .s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace;font-size:16px;fill:#A8C0D8;letter-spacing:3px}
    </style>
  </defs>
  <rect width="1200" height="190" fill="url(#bg)"/>
  <g class="b"><path d="M0 138 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V190 H0 Z" fill="url(#wB)"/></g>
  <g class="a"><path d="M0 152 q150 -30 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V190 H0 Z" fill="url(#wA)"/></g>
  <text class="t" x="600" y="96" text-anchor="middle">Niaz Ul Haque</text>
  <text class="s" x="600" y="126" text-anchor="middle">software engineer &#183; toronto, canada</text>
</svg>
